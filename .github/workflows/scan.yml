name: Stock scan

on:
  schedule:
    # GitHub cron is in UTC. IST = UTC + 5:30.
    # Every 5 min from 09:15 to 15:15 IST on weekdays (03:45-09:45 UTC)
    - cron: "45,50,55 3 * * 1-5"
    - cron: "*/5 4-8 * * 1-5"
    - cron: "0,5,10,15,20,25,30,35,40,45 9 * * 1-5"
    # One evening run at 16:10 IST (backtest view with same-day outcome)
    - cron: "40 10 * * 1-5"
  workflow_dispatch:

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Kolkata
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
      ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scan
        run: python cloud_scan.py
      - name: Publish results
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add data.json index.html
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "scan $(date '+%d-%b %H:%M IST')"
            git push
          fi
